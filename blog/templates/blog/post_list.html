{% extends "blog/base.html" %}

{% block content %}
  <h1>Posts</h1>
  {% for post in post_list %}
    <article>
      <h2><a href="{% url 'blog:post_detail' slug=post.slug %}">{{ post.title }}</a></h2>
      <p>{{ post.author }} · {{ post.published_at|date:"j M Y" }}</p>
    </article>
  {% empty %}
    <p>No posts yet.</p>
  {% endfor %}
{% endblock %}
