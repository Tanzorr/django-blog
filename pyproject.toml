[project]
name = "pyton-curse"
version = "0.1.0"
description = "A first Django project, built to learn Django and Python."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes · I: import order · B: likely bugs
# UP: modern syntax · DJ: Django-specific rules · SIM: simpler code
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
